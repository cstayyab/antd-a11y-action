# Runs the action from this checkout against fixtures/app, which deliberately
# breaks every rule, and checks the action fails with the expected counts.
name: Self-test

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run antd A11y Guard on fixtures/app
        id: guard
        uses: ./
        continue-on-error: true
        with:
          working-directory: fixtures/app
          changed-only: false
          config: fixtures/app/antd-a11y.json   # wrapper aliases for src/bad/Wrappers.tsx
          comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Check the results
        env:
          OUTCOME: ${{ steps.guard.outcome }}
          VIOLATIONS: ${{ steps.guard.outputs.violations }}
          BLOCKING: ${{ steps.guard.outputs.blocking-violations }}
        run: |
          echo "outcome=$OUTCOME violations=$VIOLATIONS blocking=$BLOCKING"
          test "$OUTCOME" = "failure"
          test "$VIOLATIONS" = "30"
          test "$BLOCKING" = "24"

      # The theme audit on the fixture's ConfigProvider theme, with the bundled antd (no npm ci here).
      - name: Run the theme audit on fixtures/app
        id: theme
        uses: ./
        continue-on-error: true
        with:
          mode: theme
          working-directory: fixtures/app
          changed-only: false
          comment: false
          sarif-file: antd-a11y-theme.sarif

      - name: Check the theme results
        env:
          OUTCOME: ${{ steps.theme.outcome }}
          VIOLATIONS: ${{ steps.theme.outputs.violations }}
          BLOCKING: ${{ steps.theme.outputs.blocking-violations }}
        run: |
          echo "outcome=$OUTCOME violations=$VIOLATIONS blocking=$BLOCKING"
          test "$OUTCOME" = "failure"
          test "$VIOLATIONS" = "109"
          test "$BLOCKING" = "29"

      - name: Upload SARIF to code scanning
        if: always() && steps.guard.outputs.sarif-file != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: ${{ steps.guard.outputs.sarif-file }}
          category: antd-a11y-self-test

  # The baseline against fixtures/baseline-app, a package in a monorepo, with a partial baseline: two
  # of three identical findings, one finding left out, an entry for a deleted file and one for another
  # package (which this job must leave alone). Then a committed rename, which must stay baselined.
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check against the baseline
        id: guard
        uses: ./
        continue-on-error: true
        with:
          working-directory: fixtures/baseline-app
          changed-only: false
          comment: false
          baseline: fixtures/baseline-app/antd-a11y-baseline.json
          baseline-age-warning: 90
          sarif-file: antd-a11y-baseline.sarif

      - name: Check the results
        env:
          OUTCOME: ${{ steps.guard.outcome }}
          VIOLATIONS: ${{ steps.guard.outputs.violations }}
          BLOCKING: ${{ steps.guard.outputs.blocking-violations }}
          BASELINED: ${{ steps.guard.outputs.baselined }}
          FIXED: ${{ steps.guard.outputs.fixed }}
          OLDEST: ${{ steps.guard.outputs.baseline-oldest }}
          AGED: ${{ steps.guard.outputs.baseline-aged }}
        run: |
          echo "outcome=$OUTCOME violations=$VIOLATIONS blocking=$BLOCKING baselined=$BASELINED fixed=$FIXED oldest=$OLDEST aged=$AGED"
          test "$OUTCOME" = "failure"
          test "$VIOLATIONS" = "6"
          test "$BLOCKING" = "2"
          test "$BASELINED" = "4"
          test "$FIXED" = "1"
          test "$OLDEST" = "2025-01-15"
          test "$AGED" = "1"

      - name: Shrink leaves the other package's entry and adds nothing
        run: |
          env INPUT_MODE=static 'INPUT_WORKING-DIRECTORY=fixtures/baseline-app' 'INPUT_CHANGED-ONLY=false' \
            INPUT_COMMENT=false INPUT_BASELINE=fixtures/baseline-app/antd-a11y-baseline.json 'INPUT_BASELINE-UPDATE=shrink' \
            'INPUT_SARIF-FILE=shrink.sarif' GITHUB_OUTPUT=/dev/null node dist/index.mjs
          node -e "
            const { entries } = require('./fixtures/baseline-app/antd-a11y-baseline.json');
            const got = entries.map((e) => e.file.split('/').pop() + ':' + e.count).join(' ');
            console.log(got);
            if (got !== 'Orders.tsx:1 Page.tsx:2 Page.tsx:1 Settings.tsx:1') process.exit(1);
          "
          git checkout -- fixtures/baseline-app/antd-a11y-baseline.json

      - name: A renamed file stays baselined (push run, renames from the last commit)
        run: |
          git -c user.name=self-test -c user.email=self-test@example.com mv fixtures/baseline-app/src/Orders.tsx fixtures/baseline-app/src/OrdersPage.tsx
          git -c user.name=self-test -c user.email=self-test@example.com commit -qm "Rename Orders"
          echo '{}' > "$RUNNER_TEMP/push-event.json"
          : > "$RUNNER_TEMP/out.txt"
          env GITHUB_EVENT_NAME=push GITHUB_EVENT_PATH="$RUNNER_TEMP/push-event.json" GITHUB_OUTPUT="$RUNNER_TEMP/out.txt" \
            INPUT_MODE=static 'INPUT_WORKING-DIRECTORY=fixtures/baseline-app' 'INPUT_CHANGED-ONLY=false' INPUT_COMMENT=false \
            INPUT_BASELINE=fixtures/baseline-app/antd-a11y-baseline.json 'INPUT_SARIF-FILE=rename.sarif' node dist/index.mjs || true
          grep -A1 '^baselined<<' "$RUNNER_TEMP/out.txt" | sed -n 2p | grep -qx 4
          grep -A1 '^blocking-violations<<' "$RUNNER_TEMP/out.txt" | sed -n 2p | grep -qx 2

  # Runtime sub-action against fixtures/next-app (Next 15.5, React 19, antd 6).
  runtime-next:
    name: runtime-next (next ${{ matrix.next }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The fixture's lockfile pins 15.5; the 16 leg upgrades next in place.
        next: ['15.5', '16']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fixtures/next-app/package-lock.json
      - run: npm ci
        working-directory: fixtures/next-app
      - name: Use next ${{ matrix.next }}
        if: matrix.next != '15.5'
        working-directory: fixtures/next-app
        env:
          NEXT_RANGE: ${{ matrix.next }}
        run: npm install --no-save --no-audit --no-fund "next@^$NEXT_RANGE"

      - name: Run the runtime check (Next mode)
        id: runtime
        uses: ./runtime
        continue-on-error: true
        with:
          working-directory: fixtures/next-app
          framework: next
          setup: a11y/setup.mjs
          fail-on-redirect: 'true'
          artifact-name: antd-a11y-runtime-next-${{ matrix.next }}
          comment: ${{ matrix.next == '15.5' && github.event.pull_request.head.repo.full_name == github.repository }}

      - name: Check the results
        env:
          OUTCOME: ${{ steps.runtime.outcome }}
          GUARD: ${{ steps.runtime.outputs.guard-active }}
          BLOCKING: ${{ steps.runtime.outputs.blocking }}
          REDIRECTS: ${{ steps.runtime.outputs.redirects }}
        run: |
          echo "outcome=$OUTCOME guard-active=$GUARD blocking=$BLOCKING redirects=$REDIRECTS"
          test "$OUTCOME" = "failure"
          test "$GUARD" = "true"
          test "$BLOCKING" -gt 0
          # setup signed in, so the signed-in page was crawled rather than redirected to /login.
          test "$REDIRECTS" = "0"
          # The guard must blame each issue on its own line in app/bad/page.tsx.
          node -e '
            const r = require(process.env.A11Y_OUT + "/bad.json");
            const at = (rule, origin) => r.runtime.find((v) => v.rule === rule && v.origin === origin)?.location;
            const expect = [["accessible-name", "library", 14], ["click-events-need-role", "app", 15], ["image-alt", "app", 16]];
            for (const [rule, origin, line] of expect) {
              const loc = at(rule, origin);
              if (!loc || loc.file !== "app/bad/page.tsx" || loc.line !== line) {
                console.error(`${rule}: expected app/bad/page.tsx:${line}, got ${JSON.stringify(loc)}`);
                process.exit(1);
              }
            }
            const account = require(process.env.A11Y_OUT + "/account.json").runtime.find((v) => v.rule === "accessible-name");
            if (account?.location?.file !== "app/account/panel.tsx" || account.location.line !== 7) {
              console.error(`signed-in page: expected app/account/panel.tsx:7, got ${JSON.stringify(account?.location)}`);
              process.exit(1);
            }
            for (const clean of ["root", "grouped"]) {
              const page = require(process.env.A11Y_OUT + "/" + clean + ".json");
              if (page.runtime.length || page.axe.length) { console.error(clean + " should be clean"); process.exit(1); }
            }
            console.log("guard blame and clean pages OK");
          '

  runtime-generic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fixtures/next-app/package-lock.json
      - run: npm ci
        working-directory: fixtures/next-app

      - name: Run the runtime check (generic mode)
        id: runtime
        uses: ./runtime
        continue-on-error: true
        with:
          working-directory: fixtures/next-app
          framework: generic
          start-command: npx next dev -p 3200
          target-url: http://localhost:3200
          routes: |
            /
            /bad
            /rsc-bad
          artifact-name: antd-a11y-runtime-generic
          comment: 'false'

      - name: Check the results
        env:
          OUTCOME: ${{ steps.runtime.outcome }}
          GUARD: ${{ steps.runtime.outputs.guard-active }}
          BLOCKING: ${{ steps.runtime.outputs.blocking }}
        run: |
          echo "outcome=$OUTCOME guard-active=$GUARD blocking=$BLOCKING"
          test "$OUTCOME" = "failure"
          test "$GUARD" = "false"
          test "$BLOCKING" -gt 0
