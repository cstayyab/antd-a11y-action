name: antd A11y Guard
description: Block pull requests that introduce accessibility violations in React + Ant Design apps.
author: cstayyab
branding:
  icon: eye
  color: blue

inputs:
  mode:
    description: >-
      Comma-separated layers to run: static (lint the JSX), theme (audit the antd theme's colour
      contrast). The runtime check is the separate cstayyab/antd-a11y-action/runtime sub-action.
    default: static
  fail-on:
    description: >-
      Lowest impact that fails the check (minor | moderate | serious | critical | none). Empty uses the config
      file's failOn, which a local ESLint run reads too, or serious.
    default: ''
  changed-only:
    description: On pull_request events, scan only files the PR adds or modifies.
    default: 'true'
  include:
    description: Globs (comma or newline separated) relative to working-directory.
    default: '**/*.{js,jsx,ts,tsx}'
  exclude:
    description: Globs to skip, relative to working-directory. node_modules, dist and build are always skipped.
    default: ''
  working-directory:
    description: Directory to scan, relative to the repository root.
    default: .
  jsx-a11y:
    description: >-
      jsx-a11y preset for plain JSX elements: recommended (tuned; see README "Precision"), strict, or false.
      Empty lets the config file decide, else recommended. true means recommended.
    default: ''
  rules:
    description: >-
      Per-rule severity, one "rule-id: off|warn|error" per line. warn reports but never blocks; error always
      blocks; off doesn't run the rule. Bare names mean antd-a11y rules.
    default: ''
  components:
    description: >-
      Map wrapper components to the element they render, one "Name: tag" per line, so jsx-a11y checks them
      (e.g. "Icon: svg"). FontAwesomeIcon is mapped to svg by default. antd components need no mapping.
    default: ''
  aliases:
    description: >-
      In-house wrappers around antd components, one "WrapperName: AntdComponent" per line (e.g.
      "HintTooltip: Tooltip"), so the antd rules check them. Only imported components match. For per-rule
      aliases (a wrapper that meets a rule when it gets a prop), use the config file.
    default: ''
  theme-config:
    description: >-
      mode: theme. A module that exports the theme ("src/theme.ts", or "src/theme.ts#darkTheme" for a
      named export), for themes built with functions or imports. This runs repository code: use it on
      pull_request, never pull_request_target. Empty finds ConfigProvider themes without running code.
    default: ''
  config:
    description: JSON config file (rules with options, jsx-a11y settings, aliases), relative to the repository root. Used only if it exists.
    default: .github/antd-a11y.json
  comment:
    description: Post or update one sticky PR comment with the results.
    default: 'true'
  sarif-file:
    description: Where to write the SARIF report, relative to the repository root.
    default: antd-a11y.sarif
  max-annotations:
    description: Maximum number of inline annotations to emit.
    default: '50'
  github-token:
    description: Token used to list PR files and write the PR comment.
    default: ${{ github.token }}
  baseline:
    description: >-
      Baseline file of known findings, relative to the repository root (e.g. .github/antd-a11y-baseline.json).
      Its findings are reported but never block; only new ones do. Empty uses the config file's "baseline".
    default: ''
  baseline-update:
    description: >-
      false, shrink or full. shrink removes fixed entries and never adds any (run it on pushes to the default
      branch); full rewrites this working directory's entries from the scan (needs changed-only: false). Either
      writes the file, uploads it as an artifact and blocks nothing; commit it in a later step.
    default: 'false'
  baseline-strict:
    description: Fail when the baseline has entries that are already fixed, including entries for deleted files.
    default: 'false'
  baseline-age-warning:
    description: Days. Warn about baselined entries older than this. Never fails the check.
    default: ''

outputs:
  violations:
    description: Total number of findings.
  blocking-violations:
    description: Findings that block (at or above fail-on, not in the baseline).
  sarif-file:
    description: Absolute path of the SARIF report.
  baselined:
    description: Findings that are in the baseline (reported, never blocking).
  fixed:
    description: Baseline entries with no matching finding any more (ready to remove).
  baseline-oldest:
    description: The oldest "added" date among baselined entries, YYYY-MM-DD.
  baseline-aged:
    description: Baselined entries older than baseline-age-warning days.
  baseline-file:
    description: Absolute path of the updated baseline file (baseline-update only).

runs:
  using: node24
  main: dist/index.mjs
